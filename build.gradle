plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'io.github.ben-manes.versions' version '0.64.0'
    id 'org.beryx.jlink' version '4.1.1'
    id 'jacoco'
    id 'net.ltgt.errorprone' version '5.1.1'
    id 'org.sonarqube' version '7.5.0.8588'
    id 'org.ysb33r.cloudci' version '6.0.0'
    id 'com.github.hierynomus.license' version '0.16.1'
    id 'io.miret.etienne.sass' version '1.6.0'
}

group = 'com.github.mfl28'
version = '2.3.0'

repositories {
    mavenCentral()
}

dependencies {
    // Junit (Unit testing)
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'

    // JUnit Platform launcher (must be on the test runtime classpath since Gradle 9) https://mvnrepository.com/artifact/org.junit.platform/junit-platform-launcher
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.3'

    // TestFx UI TesTing // https://mvnrepository.com/artifact/org.testfx/testfx-junit5
    testImplementation('org.testfx:testfx-junit5:4.0.18') {
        exclude group: 'org.hamcrest'
    }

    // Hamcrest https://mvnrepository.com/artifact/org.hamcrest/hamcrest
    testImplementation 'org.hamcrest:hamcrest:3.0'

    // Mockito https://mvnrepository.com/artifact/org.mockito/mockito-core
    testImplementation 'org.mockito:mockito-core:5.24.0'

    // Mockito as Java agent for the inline mock maker (avoids dynamic agent self-attach on JDK 21+)
    configurations.maybeCreate('mockitoAgent')
    mockitoAgent('org.mockito:mockito-core:5.24.0') {
        transitive = false
    }

    // Mockito-Junit https://mvnrepository.com/artifact/org.mockito/mockito-junit-jupiter
    testImplementation 'org.mockito:mockito-junit-jupiter:5.24.0'

    // Commons Collections https://mvnrepository.com/artifact/org.apache.commons/commons-collections4
    implementation 'org.apache.commons:commons-collections4:4.6.0'

    // Commons Lang https://mvnrepository.com/artifact/org.apache.commons/commons-lang3
    implementation 'org.apache.commons:commons-lang3:3.20.0'

    // ControlsFX https://mvnrepository.com/artifact/org.controlsfx/controlsfx
    implementation('org.controlsfx:controlsfx:11.2.5') {
        exclude group: 'org.openjfx'
    }

    // Caffeine https://mvnrepository.com/artifact/com.github.ben-manes.caffeine/caffeine
    implementation 'com.github.ben-manes.caffeine:caffeine:3.3.0'

    // Gradle plugin to use the error-prone compiler https://github.com/tbroyer/gradle-errorprone-plugin
    errorprone "com.google.errorprone:error_prone_core:${errorproneVersion}"

    // Google GSON https://github.com/google/gson
    implementation 'com.google.code.gson:gson:2.14.0'

    // Jersey REST client https://mvnrepository.com/artifact/org.glassfish.jersey.core/jersey-client
    implementation 'org.glassfish.jersey.core:jersey-client:3.1.12'

    // HK2 InjectionManager https://mvnrepository.com/artifact/org.glassfish.jersey.inject/jersey-hk2
    implementation 'org.glassfish.jersey.inject:jersey-hk2:3.1.12'

    // Jersey Multipart https://mvnrepository.com/artifact/org.glassfish.jersey.media/jersey-media-multipart
    implementation 'org.glassfish.jersey.media:jersey-media-multipart:3.1.12'

    // Jaxb runtime https://mvnrepository.com/artifact/org.glassfish.jaxb/jaxb-runtime
    implementation 'org.glassfish.jaxb:jaxb-runtime:4.0.9'

    // Mimepull https://mvnrepository.com/artifact/org.jvnet.mimepull/mimepull
    implementation 'org.jvnet.mimepull:mimepull:1.11.0'

    // Xml bind https://mvnrepository.com/artifact/jakarta.xml.bind/jakarta.xml.bind-api
    implementation 'jakarta.xml.bind:jakarta.xml.bind-api:4.0.5'

    // https://mvnrepository.com/artifact/jakarta.ws.rs/jakarta.ws.rs-api
    implementation 'jakarta.ws.rs:jakarta.ws.rs-api:3.1.0'
}

javafx {
    version = javafxVersion
    modules = ['javafx.controls', 'javafx.swing']
}

test {
    useJUnitPlatform()

    jvmArgs = ['-Dtestfx.robot=awt', '-Dprism.forceGPU=true']
    maxHeapSize = '3072m'

    def mockitoAgentJar = configurations.mockitoAgent
    jvmArgumentProviders.add({ ["-javaagent:${mockitoAgentJar.singleFile}".toString()] } as CommandLineArgumentProvider)

    dependsOn compileSass
    finalizedBy jacocoTestReport
}

ci {
    githubactions {
        test {
            systemProperty "fullScreenTests", false
            jvmArgs = ['-Dprism.verbose=true', '-Djava.net.preferIPv6Addresses=system']

            if(org.gradle.internal.os.OperatingSystem.current().macOsX) {
                // Currently there is no support for running UI tests on macOS in a VM via github-actions.
                useJUnitPlatform {
                    excludeTags 'ui'
                }
            }
        }
    }
}

jacocoTestReport {
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

def isNonStable = { String version ->
  def stableKeyword = ['RELEASE', 'FINAL', 'GA'].any { it -> version.toUpperCase().contains(it) }
  def regex = /^[0-9,.v-]+(-r)?$/
  return !stableKeyword && !(version ==~ regex)
}

tasks.named("dependencyUpdates").configure {
  rejectVersionIf {
    isNonStable(it.candidate.version)
  }
}

compileSass {
    outputDir = layout.buildDirectory.dir("resources/main/stylesheets/css").get().asFile
    destPath = "."
    sourceDir = project.file ("${projectDir}/src/main/resources/stylesheets/scss")
    style = expanded
    noCharset ()
    noErrorCss ()
    sourceMap = none
    mustRunAfter processResources
}

// compileSass writes into the main resources directory, so every consumer of the main output must run after it.
tasks.named('classes') { dependsOn compileSass }
tasks.named('compileTestJava') { dependsOn compileSass }

// Gradle only infers the module path for jars that declare a module name. Some dependencies (e.g. Jersey 3.0.x)
// are plain jars that the module descriptor requires via their file-name-derived automatic module name, so the
// main module is compiled and run with the complete classpath on the module path instead.
abstract class ModulePathArgumentProvider implements CommandLineArgumentProvider {
    @Classpath
    abstract ConfigurableFileCollection getModulePath()

    @Optional
    @Input
    abstract Property<String> getPatchedModule()

    @InputFiles
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract ConfigurableFileCollection getPatchModuleFiles()

    @Override
    Iterable<String> asArguments() {
        def args = ['--module-path', modulePath.asPath]
        if(patchedModule.present && !patchModuleFiles.empty) {
            args += ['--patch-module', "${patchedModule.get()}=${patchModuleFiles.asPath}".toString()]
        }
        return args
    }
}

compileJava {
    options.compilerArgs.addAll(['-Xlint:all', '-Xlint:-requires-automatic'])

    modularity.inferModulePath = false
    def modulePathArgs = objects.newInstance(ModulePathArgumentProvider)
    modulePathArgs.modulePath.from(configurations.compileClasspath)
    options.compilerArgumentProviders.add(modulePathArgs)
    classpath = files()
}

tasks.named('run', JavaExec) {
    def modulePathArgs = objects.newInstance(ModulePathArgumentProvider)
    modulePathArgs.modulePath.from(sourceSets.main.output.classesDirs, configurations.runtimeClasspath)
    modulePathArgs.patchedModule = application.mainModule
    modulePathArgs.patchModuleFiles.from(sourceSets.main.output.resourcesDir)
    jvmArgumentProviders.add(modulePathArgs)
    classpath = files()
    dependsOn compileSass
}

jar {
    dependsOn compileSass
    from compileSass.outputDir
}

application {
    mainModule = "com.github.mfl28.boundingboxeditor"
    mainClass = "com.github.mfl28.boundingboxeditor.BoundingBoxEditorApp"
    applicationDefaultJvmArgs = ['-Dprism.forceGPU=true', '-Djava.net.preferIPv6Addresses=system']
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
    modularity.inferModulePath = true
}

jlink {
    javaHome = javaToolchains.launcherFor(java.toolchain).get().metadata.installationPath.asFile.absolutePath
    options = ['--strip-debug', '--compress', 'zip-6', '--no-header-files', '--no-man-pages']
    launcher {
        name = 'BoundingBoxEditor'
        jvmArgs = ['-Dprism.forceGPU=true', '-Djava.net.preferIPv6Addresses=system']
    }

    forceMerge 'jakarta'

    imageZip = layout.buildDirectory.file("distributions/boundingboxeditor-${javafx.platform.classifier}.zip")

    jpackage {
        installerOptions.addAll([
                '--app-version', version,
                '--copyright', 'Copyright 2022, Markus Fleischhacker',
                '--description', 'Graphical image annotation application',
                '--license-file', 'LICENSE',
                '--vendor', 'Markus Fleischhacker',
        ])

        if(org.gradle.internal.os.OperatingSystem.current().windows) {
            installerOptions.addAll([
                    '--win-per-user-install',
                    '--win-dir-chooser',
                    '--win-menu',
                    '--win-menu-group', 'Bounding Box Editor',
                    '--win-shortcut'
            ])
            icon = 'src/main/resources/icons/app_icon.ico'
            installerType = 'exe'
        } else if(org.gradle.internal.os.OperatingSystem.current().linux) {
            installerOptions.addAll([
                    '--resource-dir', 'build/jpackage/BoundingBoxEditor/lib',
                    '--linux-shortcut',
                    '--linux-menu-group', 'Graphics',
                    '--linux-deb-maintainer', 'markus.fleischhacker28@gmail.com'
            ])
            icon = 'src/main/resources/icons/app_icon.png'
        } else if(org.gradle.internal.os.OperatingSystem.current().macOsX) {
            icon = 'src/main/resources/icons/app_icon.icns'
        }

        // Allow to pass installer type as command line parameter:
        if(project.hasProperty('installerType')) {
            installerType = project.property('installerType')
        }
    }
}

tasks.register('dist') {
    dependsOn clean, jlinkZip
}

sonar {
    properties {
        property "sonar.projectKey", "mfl28_BoundingBoxEditor"
        property "sonar.organization", "mfl28"
    }
}

license {
    header = rootProject.file('gradle/LICENSE_HEADER')
    strictCheck = true

    mapping {
        scss = 'SLASHSTAR_STYLE'
        css = 'SLASHSTAR_STYLE'
        java = 'SLASHSTAR_STYLE'
    }

    excludes(['**/_*.scss', '**/styles.css', '**/testannotations/**/*', '**/testimages/**/*', '**/icons/*'])

    ext.year = '2022'
    ext.author = 'Markus Fleischhacker'
    ext.project = 'Bounding Box Editor'
    ext.email = 'markus.fleischhacker28@gmail.com'
}

